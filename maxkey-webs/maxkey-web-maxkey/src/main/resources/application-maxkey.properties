############################################################################
#spring.profiles.active=http                                               #
############################################################################
#server port
server.port                                     =${SERVER_PORT:9527}
#session default 600
#600s   =10m
#1800s  =30m
#3600s  =1h
#28800s =8h
server.servlet.session.timeout                  =${SERVLET_SESSION_TIMEOUT:600}
#server context path
server.servlet.context-path                     =/sign

#反向代理（nginx）后面的真实协议/端口识别
#本应用在 nginx 之后只监听 127.0.0.1:9527（http），对外的 scheme/port 由 nginx 决定。
#置为 native 后，Tomcat 的 RemoteIpValve 会读取 nginx 传来的
#X-Forwarded-Proto / X-Forwarded-Port / X-Forwarded-For，request.getScheme()、
#getServerPort()、getRemoteAddr() 返回的都是对外值。
#影响面（都是实测确认过的）：
#  1. OIDC 元数据 issuer —— OpenidConfigurationEndpoint 用 WebContext.getContextPath(true)，
#     后者基于 UrlUtils.buildFullRequestUrl()，取的就是 request.getScheme()/getServerPort()。
#     不开这个开关，元数据里会出现 http://127.0.0.1:9527/sign，SSO 回跳直接失败。
#  2. JWT 的 iss 声明 —— 见下方 maxkey.server.uri。
#  3. 登录日志里记录的客户端 IP —— 不开则全部是 127.0.0.1。
#可选值：NONE(默认) / NATIVE / FRAMEWORK。选 NATIVE 而非 FRAMEWORK：
#NATIVE 在 Tomcat 连接器层生效，Servlet 规范的全部三个方法都正确；
#FRAMEWORK 是 Servlet Filter，覆盖范围取决于 filter 顺序，更容易漏。
server.forward-headers-strategy                 =${FORWARD_HEADERS_STRATEGY:NATIVE}

server.frontend.port                            =${SERVER_FRONTEND_PORT:4200}
############################################################################
#domain name configuration                                                 #
############################################################################
#对外访问地址。【这是本部署方案里唯一需要改的地址类配置】
#
#为什么不直接用下面的 maxkey.server.name 自动拼：见 maxkey.server.uri 的说明。
#格式：scheme://host[:port][/path]，不含末尾斜杠。
#  http  + 80  →  http://sso.example.gov.cn
#  https + 443 →  https://sso.example.gov.cn
#  https + 9443→  https://sso.example.gov.cn:9443
#
#注意：键名故意叫 maxkey.public.url 而不是 MAXKEY_PUBLIC_URL。
#若把键名写成 MAXKEY_PUBLIC_URL 又把值写成 ${MAXKEY_PUBLIC_URL:...}，
#就是自己引用自己，Spring 的占位符解析会陷入循环引用。
#环境变量 MAXKEY_PUBLIC_URL 依然可以覆盖，因为 ${...} 会去 Environment 里找同名变量。
maxkey.public.url                               =${MAXKEY_PUBLIC_URL:http://sso.${SERVER_DOMAIN:maxkey.top}}

maxkey.server.scheme                            =${MAXKEY_PUBLIC_SCHEME:http}
maxkey.server.basedomain                        =${SERVER_DOMAIN:maxkey.top}
maxkey.server.domain                            =sso.${maxkey.server.basedomain}
maxkey.server.name                              =${maxkey.server.scheme}://${maxkey.server.domain}
#公网可访问的服务根地址（含 context-path）
#
#重要：这里【不能】再拼 :${server.port}。
#历史写法是 ${maxkey.server.name}:${server.port}${server.servlet.context-path}，
#在应用直接对外暴露 9527 时是对的，但在 nginx 反代场景下会把内部端口写进对外 URL，
#而 maxkey.auth.jwt.issuer 直接引用本项 —— 于是签出的 JWT 里 iss 是
#http://sso.xxx:9527/sign，浏览器侧看到的却是 https://sso.xxx/sign，两边不一致。
#JwtLoginService.jwtTokenValidation() 对 iss 做的是【严格相等】比对（:91），
#不一致即判定 token 无效，表现为登录成功但立刻被踢回登录页。
#
#改由 MAXKEY_PUBLIC_URL 统一驱动，保证：
#  签发（AuthTokenService）与校验（JwtLoginService）取到的是同一个固定值，
#  不随请求 Host 漂移，也不会因 nginx 端口变化而失配。
maxkey.server.uri                               =${maxkey.public.url}/sign
#default.uri
maxkey.server.default.uri                       =${maxkey.server.uri}/appList
#管理端入口地址（浏览器访问，走 nginx 静态前端，不是 API 端口 9526）
maxkey.server.mgt.uri                           =${maxkey.public.url}/maxkey-mgt/
maxkey.server.authz.uri                         =${maxkey.server.uri}
#前端静态资源的访问前缀（nginx 上的子目录，与 Angular build --base-href 对应）
#http://sso.maxkey.top/sign
#http://sso.maxkey.top/maxkey
maxkey.server.frontend.uri                      =${MAXKEY_FRONTEND_URI:/maxkey}
#InMemory 0 , Redis 2               
maxkey.server.persistence                       =${SERVER_PERSISTENCE:0}
#issuer name                
maxkey.app.issuer                               =CN=ConSec,CN=COM,CN=SH

#jwt token
maxkey.auth.jwt.expires                         =${SERVER_EXPIRES:1800}
maxkey.auth.jwt.secret                          =${JWT_SECRET}
#must > jwt expire * 2
maxkey.auth.jwt.refresh.expires                 =${SERVER_REFRESH_EXPIRES:28800}
maxkey.auth.jwt.refresh.secret                  =${JWT_SECRET}
maxkey.auth.jwt.issuer                          =${maxkey.server.uri}

#plain,bcrypt,pbkdf2,scrypt,md4,md5,sha1,sha256,sha384,sha512,sm3,ldap
maxkey.crypto.password.encoder                  =bcrypt
############################################################################
#Login configuration                                                       #
############################################################################
#enable captcha
maxkey.login.captcha                            =${LOGIN_CAPTCHA:true}
#TEXT ARITHMETIC
maxkey.login.captcha.type                       =${LOGIN_CAPTCHA:TEXT}
#enable two factor,use one time password
maxkey.login.mfa                                =${LOGIN_MFA_ENABLED:true}
#TimeBasedOtpAuthn MailOtpAuthn SmsOtpAuthnYunxin SmsOtpAuthnAliyun SmsOtpAuthnTencentCloud
maxkey.login.mfa.type                           =${LOGIN_MFA_TYPE:TimeBasedOtpAuthn}
#enable social sign on          
maxkey.login.socialsignon                       =${LOGIN_SOCIAL_ENABLED:true}
#Enable kerberos/SPNEGO         
maxkey.login.kerberos                           =false
#wsFederation           
maxkey.login.wsfederation                       =false
#remeberme          
maxkey.login.remeberme                          =${LOGIN_REMEBERME:true}
#validity day          
maxkey.login.remeberme.validity                 =0
#JWT support
maxkey.login.jwt                                =${LOGIN_JWT:false}
maxkey.login.jwt.issuer                         =${LOGIN_JWT_ISSUER:${maxkey.server.authz.uri}}
#whitelist       
maxkey.ipaddress.whitelist                      =false
#registration
maxkey.login.registration                       =${LOGIN_REGISTRATION:false}
#notices show
maxkey.notices.visible                          =false
############################################################################
# Passkey Configuration                                                     #
############################################################################
maxkey.login.passkey.enabled=true
maxkey.login.passkey.relying-party.name=MaxKey
maxkey.login.passkey.relying-party.id=localhost
maxkey.login.passkey.relying-party.allowed-origins=http://localhost
