# ===========================================================================
#  MaxKey 前端 —— 独立 nginx 站点（方案 A：麒麟上本无 nginx 或允许另起实例）
#
#  安装位置（麒麟/多数发行版）: /etc/nginx/conf.d/maxkey.conf
#  校验: nginx -t          重载: nginx -s reload
#
#  这份配置的目录布局与仓库自带的 deployment/docker/docker-nginx/default.conf
#  一致：静态文件放在 html/maxkey、html/maxkey-mgt 两个子目录下，
#  这样 docker 部署与裸机部署可以共用同一份前端产物。
# ===========================================================================

server {
    listen       80;
    server_name  _;                       # 未绑定域名时先接住所有 Host

    # 静态文件根目录，子目录为 maxkey / maxkey-mgt
    root  /opt/maxkey/web;
    index index.html;

    charset utf-8;
    access_log  /var/log/nginx/maxkey.access.log;
    error_log   /var/log/nginx/maxkey.error.log warn;

    # ---------------------------------------------------------------- 前端 --
    # 说明：前端使用 hash 路由（environment.ts 中 useHash: true），
    # 因此 http://host/maxkey/#/passport/login 这段 "#..." 根本不会发到服务端，
    # 正常情况下不需要 SPA 回退。但 index.html 的 <base href="./"> 与
    # 无 hash 的深链接（如直接粘贴 /maxkey/passport/login）仍需要回退，故保留。

    location = /maxkey      { return 302 /maxkey/; }
    location = /maxkey-mgt  { return 302 /maxkey-mgt/; }

    # 静态资源缺失必须真 404。若回退到 index.html，浏览器会以 text/html
    # 解析 .js 并报 "Unexpected token '<'"，排查成本很高。
    location ^~ /maxkey/assets/     { try_files $uri =404; expires 7d; access_log off; }
    location ^~ /maxkey-mgt/assets/ { try_files $uri =404; expires 7d; access_log off; }

    location /maxkey/ {
        try_files $uri $uri/ /maxkey/index.html;
    }
    location /maxkey-mgt/ {
        try_files $uri $uri/ /maxkey-mgt/index.html;
    }

    # ---------------------------------------------------------------- 后端 --
    # 认证中心(portal)。前端 environment.prod.ts 中 baseUrl 为 '/sign/'，
    # 与后端 context-path=/sign 对齐，因此必须保留尾部斜杠的 proxy_pass。
    location /sign/ {
        proxy_pass http://127.0.0.1:9527/sign/;
        include /etc/nginx/maxkey-proxy.conf;
    }

    # 管理端后端(mgt)。前端 baseUrl 为 '/maxkey-mgt-api/'，
    # 与后端 context-path=/maxkey-mgt-api 对齐。
    location /maxkey-mgt-api/ {
        proxy_pass http://127.0.0.1:9526/maxkey-mgt-api/;
        include /etc/nginx/maxkey-proxy.conf;
    }

    # 健康检查：仅确认 nginx 存活，不暴露后端细节
    location = /healthz { access_log off; return 200 "ok\n"; }
}
