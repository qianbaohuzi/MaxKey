# ===========================================================================
#  MaxKey 反向代理公共参数 —— 被 maxkey-site.conf 的两个 location include
#
#  安装位置: /etc/nginx/maxkey-proxy.conf
#  与站点文件分开，是为了让"站点路由"和"代理行为"各自演进：
#  升级 MaxKey 只换站点文件，代理头基本不用动。
# ===========================================================================

# ---- 为什么必须带这些头（每一条都对应一个会真实出错的功能）----

# Host：后端 WebInstRequestFilter 用 Host 头（或 hostname 头）查租户（机构）。
#   丢了域名，多租户场景全部退回默认租户，表现为"登录后进了别人的机构"。
proxy_set_header Host              $host;

# X-Forwarded-Proto / X-Forwarded-Port / X-Forwarded-Host：
#   后端开了 server.forward-headers-strategy=NATIVE（Tomcat RemoteIpValve），
#   靠这三个头还原对外 scheme/port。
#   不带它们，OIDC 元数据的 issuer 会变成 http://127.0.0.1:9527/sign，
#   SSO 回跳地址直接错，客户端校验 issuer 也会失败。
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Forwarded-Host  $host;

# X-Real-IP / X-Forwarded-For：
#   登录日志、会话审计、风控都依赖真实客户端 IP。
#   不透传则所有记录都是 127.0.0.1，出问题无法追查来源。
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# 前端在 default.interceptor.ts 里显式发送 hostname 头，
# 后端优先用它做租户匹配（WebInstRequestFilter.HEADER_HOSTNAME）。
# 这里原样透传，不做改写。
proxy_set_header hostname          $http_hostname;

# Cookie / Authorization 默认会透传，但显式写出以免后来者加 proxy_set_header
# 时误把它们抹掉。SSO 登录态就放在这两个头里。
proxy_set_header Cookie            $http_cookie;
proxy_set_header Authorization     $http_authorization;

# ---- 超时 ----
# SAML 断言交换、LDAP/AD 同步、大批量 SCIM 导入都可能超过默认 60s。
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# ---- 协议 ----
# 用 HTTP/1.1 并清空 Connection，让上游保持长连接，
# 否则每个 API 请求都要重新握手，前端首屏并发请求时延迟明显。
proxy_http_version 1.1;
proxy_set_header   Connection "";

# 关闭缓冲，保证 OAuth2 的 302 与流式响应及时到达浏览器。
proxy_buffering off;

# 透传上游的 3xx，不让 nginx 自行改写 Location。
# SSO 回跳全靠 Location，一旦被改写域名/端口就断了。
proxy_redirect off;

# 不缓存任何后端响应（令牌、断言、用户信息都不能进代理缓存）。
proxy_no_cache     1;
proxy_cache_bypass 1;
