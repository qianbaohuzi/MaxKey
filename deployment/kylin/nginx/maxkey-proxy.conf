# ===========================================================================
#  MaxKey 反向代理公共头（被 maxkey-standalone.conf / maxkey-into-existing.conf
#  include，安装到 /etc/nginx/maxkey-proxy.conf）
#
#  为什么这些头是必需的：
#    * Host           —— 后端 WebInstRequestFilter.java:58-67 用 Host 头解析
#                        当前租户（机构），去掉域名就会退回默认租户
#    * X-Forwarded-*  —— 后端 Service 内部生成的重定向/单点登录回跳地址依赖
#                        真实协议与端口；不传会拼出 http://host:9527 这类
#                        含内网端口、外网不可达的 URL
# ===========================================================================

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Forwarded-Host  $host;

# 单点登录会话/JWT 放在 Cookie 与 Authorization 头中，需要透传
proxy_set_header Cookie            $http_cookie;
proxy_set_header Authorization     $http_authorization;

# WebSocket（管理端部分页面使用长连接；不升级也不影响登录）
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout   10s;
proxy_send_timeout      120s;
proxy_read_timeout      120s;

proxy_buffering         off;
client_max_body_size    20m;
