# ===========================================================================
#  MaxKey 前端 —— 合并进“麒麟上已存在的 nginx”（方案 B）
#
#  适用前提：目标机已有一个在跑的 nginx，且不能/不愿为此再起一个实例。
#  做法：不新建 server 块，而是把下面整段**追加**到现有站点所在 server{} 内部。
#
#  与方案 A 的关键差异（都是实测踩过的坑）：
#    1. 不能沿用方案 A 的 `root /opt/maxkey/web;`，那会覆盖别人站点的根目录。
#       必须用 `root ... ; try_files ...` 的组合，且每个 location 单独写 root。
#    2. 不能用 `alias` + `try_files`。nginx 的 alias 与 try_files 组合有已知缺陷，
#       实测表现为：/maxkey/ 能返回 index.html，但深链接与 assets 全部 404。
#    3. 静态资源用 `^~` 前缀并 try_files $uri =404，避免被后面的 SPA 回退吃掉。
#
#  放置方式（二选一）：
#    A) 直接粘贴到 /etc/nginx/conf.d/your-site.conf 的 server{} 花括号内
#    B) 单独存为 /etc/nginx/maxkey-locations.conf，在 server{} 内写：
#           include /etc/nginx/maxkey-locations.conf;
#       推荐 B，升级时只替换被 include 的文件，不碰别人的站点配置。
#
#  校验: nginx -t     重载: nginx -s reload
# ===========================================================================

    # ------------------------------------------------------------ 前端 ----
    # 静态文件实际位置（与方案 A 相同的目录布局，便于两种方案互相切换）
    #   /opt/maxkey/web/maxkey       <- maxkey-web-ng 的 dist/browser
    #   /opt/maxkey/web/maxkey-mgt   <- maxkey-web-mgt-ng 的 dist/browser

    location = /maxkey      { return 302 /maxkey/; }
    location = /maxkey-mgt  { return 302 /maxkey-mgt/; }

    # 静态资源缺失要真 404，不能回退到 index.html
    location ^~ /maxkey/assets/ {
        root /opt/maxkey/web;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
    location ^~ /maxkey-mgt/assets/ {
        root /opt/maxkey/web;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # SPA 入口：root 指向 /opt/maxkey/web，URI 前缀 /maxkey/ 正好对上子目录名，
    # 因此 $uri 天然解析到 /opt/maxkey/web/maxkey/...，无需 alias。
    location /maxkey/ {
        root /opt/maxkey/web;
        try_files $uri $uri/ /maxkey/index.html;
    }
    location /maxkey-mgt/ {
        root /opt/maxkey/web;
        try_files $uri $uri/ /maxkey-mgt/index.html;
    }

    # ------------------------------------------------------------ 后端 ----
    # 后端只监听 127.0.0.1，不对公网暴露；context-path 与 proxy_pass 尾部斜杠必须一致
    location /sign/ {
        proxy_pass http://127.0.0.1:9527/sign/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /maxkey-mgt-api/ {
        proxy_pass http://127.0.0.1:9526/maxkey-mgt-api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
