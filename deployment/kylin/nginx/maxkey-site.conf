# ===========================================================================
#  MaxKey 站点配置 —— 独立 server 块（公共 nginx 场景）
#
#  安装位置: /etc/nginx/conf.d/maxkey.conf
#  校验:     nginx -t          重载: nginx -s reload
#
#  设计前提（本方案的取舍，逐条都对应一个真实约束）：
#
#  1. **不新建 nginx 实例**，而是作为 conf.d 里的一个独立站点文件接入。
#     公共 nginx 的 http{} 块、worker 配置、日志格式都沿用现场已有的，
#     升级 MaxKey 时只替换本文件，不碰其他站点的配置。
#
#  2. **独立 server 块 + 独立 server_name**，而不是往别人的 server{} 里
#     塞 location。理由：Cookie 作用域互相隔离，且对方改配置不会牵连 MaxKey。
#
#  3. **本文件不监听 80**（见下方 listen 说明）。
#     现场如果有其他站点（如 Keycloak）已经占了 `listen 80` 且 server_name 相同，
#     两个同名 server 会导致 nginx 报 "conflicting server name" 并且实际生效的
#     是先加载的那个 —— 表现为"改了配置但不生效"，极难排查。
#
#  4. 静态资源用 root + URI 前缀自然对齐，**不用 alias + try_files**。
#     nginx 的 alias 与 try_files 组合有已知缺陷，实测表现为
#     `/maxkey/` 返回 200 但深链接与 assets 全部 404。
#
#  5. 缺失的静态资源必须真 404，不能回退 index.html。
#     否则浏览器会把 .js 当 text/html 解析，报 "Unexpected token '<'"。
# ===========================================================================

server {
    # ------------------------------------------------------------------ 端口 --
    # 只监听 443（或现场实际使用的 TLS 端口）。
    #
    # 关于 80：MaxKey 的对外地址由 conf/maxkey.env 的 MAXKEY_PUBLIC_URL 决定，
    # 如果该值不含端口（https://sso.example.gov.cn），就必须由 443 提供服务。
    # 若现场 80 上还有别的站点，**不要**在本文件里再加一个 listen 80 的 server，
    # 而是把那边的 server 保留原样，只让它的 server_name 与本节不同。
    #
    # 需要"80 自动跳 443"时，在**已有的**那个 80 server 里加一行 return 301，
    # 不要在这里新建一个同名 server。
    listen       443 ssl;
    listen       [::]:443 ssl;

    # 服务器名。必须与 conf/maxkey.env 里 SERVER_DOMAIN 拼出来的
    # sso.<SERVER_DOMAIN> 完全一致 ——
    # 后端 WebInstRequestFilter 用 Host 头查租户（机构），域名对不上会退回默认租户。
    server_name  sso.example.gov.cn;

    # ------------------------------------------------------------------ 证书 --
    # 指向现场已有证书。不复制私钥到别的目录：轮换时只改一处。
    ssl_certificate     /etc/nginx/cert/sso.example.gov.cn.crt;
    ssl_certificate_key /etc/nginx/cert/sso.example.gov.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MaxKeySSL:10m;
    ssl_session_timeout 1d;

    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/maxkey.access.log;
    error_log  /var/log/nginx/maxkey.error.log warn;

    # OAuth2 令牌、SAML 断言都在请求体/响应体里，20m 足够；
    # 上传头像等小文件也走这里。
    client_max_body_size 20m;

    # ---------------------------------------------------------------- 前端 ----
    # 静态文件位置：
    #   /opt/maxkey/current/web/maxkey       <- maxkey-web-ng     的 dist/browser
    #   /opt/maxkey/current/web/maxkey-mgt   <- maxkey-web-mgt-ng 的 dist/browser
    #
    # 为什么必须经 current 软链、而不是写死 releases/<版本>/web：
    #   前端资源改完只需切软链，nginx 立刻提供新文件，不需要改配置、不需要 reload。
    #   写死版本号的话，每次升级都要改 nginx 配置并 reload —— 那正是
    #   "升级需要动 nginx" 这个额外风险点的来源。
    #
    # 注意 root 指向**父目录** .../web，靠 URI 前缀 /maxkey/ 自然映射到
    # 子目录 .../web/maxkey/。这样不需要 alias。

    location = /maxkey      { return 302 /maxkey/; }
    location = /maxkey-mgt  { return 302 /maxkey-mgt/; }

    # 静态资源：必须真 404（见文件头第 5 条）
    location ^~ /maxkey/assets/ {
        root /opt/maxkey/current/web;
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /maxkey-mgt/assets/ {
        root /opt/maxkey/current/web;
        try_files $uri =404;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不能缓存，否则前端发版后用户一直拿旧壳子，
    # 而旧的 chunk 已被删除 → 白屏。
    location = /maxkey/index.html {
        root /opt/maxkey/current/web;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /maxkey-mgt/index.html {
        root /opt/maxkey/current/web;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA 入口。前端用 hash 路由（useHash: true），正常访问 "#..." 不会到服务端，
    # 但直接粘贴的无 hash 深链接（/maxkey/passport/login）仍需回退到 index.html。
    location /maxkey/ {
        root /opt/maxkey/current/web;
        try_files $uri $uri/ /maxkey/index.html;
    }
    location /maxkey-mgt/ {
        root /opt/maxkey/current/web;
        try_files $uri $uri/ /maxkey-mgt/index.html;
    }

    # ---------------------------------------------------------------- 后端 ----
    # 两个后端只监听 127.0.0.1，不对公网暴露。
    # proxy_pass 的尾部斜杠和后缀路径**都不能漏**：
    #   后端 context-path 是 /sign，写成 proxy_pass http://127.0.0.1:9527;
    #   会丢前缀，所有 API 404。

    location /sign/ {
        proxy_pass http://127.0.0.1:9527/sign/;
        include /etc/nginx/maxkey-proxy.conf;
    }

    location /maxkey-mgt-api/ {
        proxy_pass http://127.0.0.1:9526/maxkey-mgt-api/;
        include /etc/nginx/maxkey-proxy.conf;
    }

    # ------------------------------------------------------------ 健康检查 ----
    # 只确认 nginx 自身存活，不暴露后端细节。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
