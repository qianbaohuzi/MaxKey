# MaxKey + KingbaseES 验证编排
#
# 前置条件：
#   1. 宿主机已运行 KingbaseES（默认 54321），且已导入 sql/kingbase/maxkey.sql
#   2. 已构建镜像：podman build -t maxkey:4.2.0-kingbase maxkey-webs/maxkey-web-maxkey/
#
# 用法：
#   export KINGBASE_PWD='你的密码'
#   podman-compose -f deployment/docker/docker-compose-kingbase.yml up -d
#   或
#   podman compose -f deployment/docker/docker-compose-kingbase.yml up -d
#
# 说明：
#   * KingbaseES 部署在宿主机而非容器内，故 maxkey 使用 host 网络直连 127.0.0.1:54321
#   * DATABASE_COLUMN_ESCAPE / _CHAR 是 Kingbase 必需项：
#     MySQL 兼容模式下 online 是保留字，MyBatis 需用双引号包裹标识符

services:
  maxkey:
    image: maxkey:4.2.0-kingbase
    container_name: maxkey-kb
    hostname: maxkey
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_DRIVER=com.kingbase8.Driver
      - DATABASE_URL=jdbc:kingbase8://127.0.0.1:54321/maxkey?characterEncoding=UTF-8&useUnicode=true
      - DATABASE_USER=${KINGBASE_USER:-system}
      - DATABASE_PWD=${KINGBASE_PWD:?请先 export KINGBASE_PWD}
      - DATABASE_DIALECT=kingbase
      - DATABASE_COLUMN_ESCAPE=true
      - 'DATABASE_COLUMN_ESCAPE_CHAR="'
      - LOGIN_CAPTCHA=${LOGIN_CAPTCHA:-true}
    restart: unless-stopped
